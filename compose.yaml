# Local development only (app + Postgres). Production runs ./Dockerfile against a managed database.
# Usage: see "Local development with Docker" in README.md.

services:
  db:
    # Official image via AWS public ECR: Cloud Shell's Docker Hub mirror often hangs.
    image: public.ecr.aws/docker/library/postgres:16-alpine
    # POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB come from .env (only read when the data folder is
    # first created; changing them later doesn't change an existing database).
    env_file:
      - path: .env
        required: true
    # Only reachable from this machine. Data lives in $HOME so it survives Cloud Shell restarts.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ${HOME}/.pricetide-dev/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: true
    environment:
      # Overrides .env so the container always talks to the db service above, with the same credentials.
      DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
    volumes:
      - .:/home/node/app
      - node_modules:/home/node/app/node_modules
      # Shopify CLI login, kept between container runs.
      - shopify-cli-config:/home/node/.config
      - shopify-cli-cache:/home/node/.cache
    stdin_open: true
    tty: true

volumes:
  node_modules:
  shopify-cli-config:
  shopify-cli-cache:
