# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration
# Linked to the Partner Dashboard app with `npm run config:link`.

client_id = "6f11327982fadfacde57f6b18a004ca8"
name = "PriceTide: Scheduled Sales"
embedded = true
# PLACEHOLDER: `npm run dev` swaps in the tunnel URL automatically. Before `npm run deploy`, set this and
# [auth].redirect_urls to the production URL (see DEPLOY.md), or the deployed app won't load or install.
application_url = "https://shopify.dev/apps/default-app-home"

[access_scopes]
# Least privilege: the app only reads and updates product variant prices.
scopes = "write_products"

[webhooks]
api_version = "2026-10"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "app_subscriptions/update" ]
  uri = "/webhooks/app_subscriptions/update"

  # Mandatory privacy (GDPR) webhooks for App Store apps.
  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/data_request" ]
  uri = "/webhooks/customers/data_request"

  [[webhooks.subscriptions]]
  compliance_topics = [ "customers/redact" ]
  uri = "/webhooks/customers/redact"

  [[webhooks.subscriptions]]
  compliance_topics = [ "shop/redact" ]
  uri = "/webhooks/shop/redact"

[auth]
redirect_urls = [ "https://shopify.dev/apps/default-app-home/api/auth" ]

[build]
include_config_on_deploy = true
automatically_update_urls_on_dev = true
