name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        # Throwaway database that exists only during this CI run: passwordless login, no secret needed.
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pricetide
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres@localhost:5432/pricetide
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - name: Security audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      - run: npx prisma validate && npx prisma generate
      - name: Migrations apply cleanly
        run: npx prisma migrate deploy
      - run: npm run typecheck
      - run: npm test
      - name: Database integration tests (webhooks, shop scoping, repo)
        run: npm run test:db
      - run: npm run lint
      - run: npm run build
      - name: Production Docker image builds
        run: docker build --tag pricetide:ci .
